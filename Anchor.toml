[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
agents_inc = "E6oC1Dm5UymCQ5Uq3EpZQgUaDS1PB1KSrGKGFXiBfVsS"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
